plugins {
    id 'com.android.application'
}
android {
    namespace 'ro.cobrabm.fexdroid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.daedalus.tlou.remastered'
        minSdk 30
        // Android 10/11 allow execution of extracted native payload in app-private files
        // for legacy target SDK. Keep separate from SDK version for compilation.
        targetSdk 28
        versionCode 41
        versionName '0.1.2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // This is an experimental sideload-only native research build, not a
    // Google Play submission. Keep targetSdk 28 until native executable
    // extraction/launch is migrated to a modern Android-safe mechanism.
    // Disable only the store-policy lint finding; retain all other release
    // lint checks and Android build validation.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs += ['../../out/android-bionic/apk-assets']
            jniLibs.srcDirs += ['../../out/android-bionic/apk-jni']
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
android.testOptions.unitTests.includeAndroidResources = true

// Robolectric sometimes attempts to fetch platform JARs itself from repo1.maven.org,
// which failed in GitHub Actions. Pre-resolve all SDKs used by the test runtime via
// Gradle's configured Maven Central repository and keep them in its local JAR folder.
// The report from run 44520060985 explicitly required Android 15 (API 35), while
// the source tests also declare SDK 30 (Android 11). These are test-only artifacts;
// neither is packaged into the app APK.
// Separate resolvable configurations are mandatory: if both SDKs are put into
// one configuration, Gradle's version conflict resolution keeps only one jar.
configurations {
    robolectricSdk11 {
        canBeConsumed = false
        canBeResolved = true
    }
    robolectricSdk15 {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    robolectricSdk11 'org.robolectric:android-all-instrumented:11-robolectric-6757853-i7'
    robolectricSdk15 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
}
def robolectricRuntimeDir = layout.buildDirectory.dir('robolectric/preinstrumented')
def prepareRobolectricSdkJars = tasks.register('prepareRobolectricSdkJars', Copy) {
    from(configurations.robolectricSdk11, configurations.robolectricSdk15)
    into(robolectricRuntimeDir)
    doLast {
        for (String jar : ['android-all-instrumented-11-robolectric-6757853-i7.jar',
                           'android-all-instrumented-15-robolectric-12650502-i7.jar']) {
            def file = new File(robolectricRuntimeDir.get().asFile, jar)
            if (!file.isFile() || file.length() == 0L)
                throw new GradleException("Missing Robolectric platform JAR: " + file)
            logger.lifecycle("Robolectric SDK staged: {}", file.name)
        }
    }
}
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    dependsOn(prepareRobolectricSdkJars)
    systemProperty 'robolectric.dependency.dir', robolectricRuntimeDir.get().asFile.absolutePath
}
