plugins {
    id 'com.android.application'
}
android {
    namespace 'ro.cobrabm.fexdroid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.daedalus.tlou.remastered'
        minSdk 30
        // Android 10/11 allow execution of extracted native payload in app-private files
        // for legacy target SDK. Keep separate from SDK version for compilation.
        targetSdk 28
        versionCode 1
        versionName '0.1-bionic-experimental'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs += ['../../out/android-bionic/apk-assets']
            jniLibs.srcDirs += ['../../out/android-bionic/apk-jni']
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
